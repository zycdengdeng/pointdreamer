exp_name: 'car_reconstruction'
exist_root_path: None

#### input
dataset_name: car_data
cls_id: 'car'
input_pc_generate_method: 'real_world'
demo: False

geo_root: None
geo_from: 'POCO'  # Options: 'POCO' (deep learning, better for noisy data) or 'SPR' (traditional)
load_exist_dense_img_path: None

use_GT_geo_watertight: False
use_GT_multi_view_img: False
noise_stddev: None
coords_scale: 1.0

input_type: 'object'

# IMPORTANT: Set to True if your point cloud is noisy
input_already_noisy: True

### output
save_dir: 'out_inference'
output_path: 'output_car'  # Results will be saved here
render_after_inference: True
save_input_pc: True

## reconstruction
project2mesh: False
texture_gen_method: 'DDNM_inpaint'  # Options: 'DDNM_inpaint' (best quality, slow), 'linear', 'nearest'

## camera
camera_distribution: 'fibonacci_sphere'  # Uniform view sampling
cam_res: 512  # Rendering resolution
view_num: 8  # Number of views (increase to 12 or 16 for better coverage of incomplete shapes)

## inpaint
res: 256  # Inpainting resolution
point_size: 1
edge_point_size: 1

# hidden point removal
point_validation_by_o3d: True
hidden_point_removal_radius: 100  # Adjust if needed
refine_point_validation_by_remove_abnormal_depth: False
refine_res: 512

# crop and rescale
crop_img: True
crop_padding: 0.05
mask_ratio_thresh: 0.82

# unproject and texture optimization
edge_dilate_kernels: [21]  # NBF kernel size. Use [21] for default, [0] to disable, [21,11,7,5,3,1] for multi-level
optimize_from: ours  # Options: None, 'scratch', 'naive', 'ours' (ours is best)
xatlas_texture_res: 1024  # Texture atlas resolution
complete_unseen_by: neighbor  # Options: 'neighbor' (fast), 'optimize' (slow but better), 'unproject'

# not used
smooth_mesh: False
sample_num: 100000
